    <div id="lightbox" class="lightbox">
  <span class="close">&times;</span>
  <span class="arrow prev">&#10094;</span>
  <img id="lightbox-img" src="" alt="">
  <span class="arrow next">&#10095;</span>
</div>

<script>
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const closeBtn = document.querySelector('.close');
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');
const items = document.querySelectorAll('.work-item');
let currentIndex = 0;

function openLightbox(index) {
  currentIndex = index;
  lightboxImg.src = items[index].href;
  lightbox.style.display = 'flex';
  document.body.style.overflow = 'hidden';   // lock background scroll
}

function closeLightbox() {
  lightbox.style.display = 'none';
  document.body.style.overflow = '';         // restore scrolling
}

function showPrev() {
  currentIndex = (currentIndex - 1 + items.length) % items.length;
  lightboxImg.src = items[currentIndex].href;
}

function showNext() {
  currentIndex = (currentIndex + 1) % items.length;
  lightboxImg.src = items[currentIndex].href;
}

items.forEach((item, index) => {
  item.addEventListener('click', (e) => {
    e.preventDefault();
    openLightbox(index);
  });
});

closeBtn.addEventListener('click', closeLightbox);
prevBtn.addEventListener('click', showPrev);
nextBtn.addEventListener('click', showNext);

lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (lightbox.style.display !== 'flex') return;  // only when lightbox is open

  if (e.key === 'ArrowLeft') {
    showPrev();
  } else if (e.key === 'ArrowRight') {
    showNext();
  } else if (e.key === 'Escape') {
    closeLightbox();
  }
});

// ... your existing openLightbox, closeLightbox, showPrev, showNext, etc. ...

// Smooth swipe
let startX = 0;
let currentX = 0;
let isDragging = false;

lightbox.addEventListener('touchstart', (e) => {
  startX = e.touches[0].clientX;
  isDragging = true;
  lightboxImg.style.transition = 'none';
}, { passive: true });

lightbox.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  currentX = e.touches[0].clientX;
  const diff = currentX - startX;
  lightboxImg.style.transform = `translateX(${diff}px)`;
}, { passive: true });

lightbox.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  const diff = currentX - startX;
  const threshold = 50;

  lightboxImg.style.transition = 'transform 0.3s ease';

  if (Math.abs(diff) > threshold) {
    // Determine direction and preload
    const goingNext = diff < 0;
    const newIndex = goingNext
      ? (currentIndex + 1) % items.length
      : (currentIndex - 1 + items.length) % items.length;

    // Preload the new image
    const preload = new Image();
    preload.src = items[newIndex].href;

    // Slide out
    lightboxImg.style.transform = goingNext ? 'translateX(-100%)' : 'translateX(100%)';

    // After slide-out, swap image and slide in
    setTimeout(() => {
      currentIndex = newIndex;
      lightboxImg.src = items[newIndex].href;
      lightboxImg.style.transition = 'none';
      lightboxImg.style.transform = goingNext ? 'translateX(100%)' : 'translateX(-100%)';

      // Force reflow then slide to center
      requestAnimationFrame(() => {
        lightboxImg.style.transition = 'transform 0.3s ease';
        lightboxImg.style.transform = 'translateX(0)';
      });
    }, 280);
  } else {
    // Snap back
    lightboxImg.style.transform = 'translateX(0)';
  }
});

</script>
